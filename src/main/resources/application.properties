spring.application.name=flicknames-service
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:flicknamesdb;NON_KEYWORDS=YEAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.flicknames.service=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# TMDB API Configuration
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/
tmdb.rate-limit.enabled=true
# Raise temporarily (e.g. 20; TMDB allows ~40) for bulk jobs such as the image backfill
tmdb.rate-limit.requests-per-second=${TMDB_REQUESTS_PER_SECOND:2}

# Automatic Data Collection Scheduler (disabled by default in dev)
collector.schedule.enabled=false
collector.schedule.popular.enabled=true
collector.schedule.popular.cron=0 0 3 * * *
collector.schedule.popular.pages=3
collector.schedule.current-year.enabled=true
collector.schedule.current-year.cron=0 0 4 * * SUN
collector.schedule.current-year.pages=5

# Admin API security: write endpoints require the X-Admin-Key header
admin.api-key=${ADMIN_API_KEY:}
# Origins allowed to make write (POST/PUT/PATCH/DELETE) requests; reads are open to any origin
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://flicknames-admin.pages.dev,http://localhost:5173}

# Scheduled model pass over new character credits (CharacterNameModelAutoPass); needs the Claude API key
character-name-model.schedule.enabled=false
character-name-model.schedule.cron=0 23 * * * *
character-name-model.schedule.submit-every-hours=24
character-name-model.schedule.max-items=20000

# Nightly rebuild of the given-name catalog (GivenNameCatalog)
given-names.refresh.enabled=false
given-names.refresh.cron=0 41 4 * * *
