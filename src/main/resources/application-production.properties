# Production Profile for Railway/Cloud Deployment
spring.application.name=flicknames-service
server.port=${PORT:8080}

# PostgreSQL Database Configuration
# Override H2 settings from base application.properties
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 Console in production
spring.h2.console.enabled=false

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.flicknames.service=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# TMDB API Configuration
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/
tmdb.rate-limit.enabled=true
# Raise temporarily (e.g. 20; TMDB allows ~40) for bulk jobs such as the image backfill
tmdb.rate-limit.requests-per-second=${TMDB_REQUESTS_PER_SECOND:2}

# Automatic Data Collection Scheduler
# Set COLLECTOR_SCHEDULE_ENABLED=true in Railway to enable
collector.schedule.enabled=${COLLECTOR_SCHEDULE_ENABLED:false}
collector.schedule.popular.enabled=${COLLECTOR_POPULAR_ENABLED:true}
collector.schedule.popular.cron=${COLLECTOR_POPULAR_CRON:0 0 3 * * *}
collector.schedule.popular.pages=${COLLECTOR_POPULAR_PAGES:10}
collector.schedule.current-year.enabled=${COLLECTOR_CURRENT_YEAR_ENABLED:true}
collector.schedule.current-year.cron=${COLLECTOR_CURRENT_YEAR_CRON:0 0 4 * * SUN}
collector.schedule.current-year.pages=${COLLECTOR_CURRENT_YEAR_PAGES:15}

# Comprehensive Collection Configuration (for 10-year collection strategy)
collector.comprehensive.us-only=${COLLECTOR_COMPREHENSIVE_US_ONLY:true}
collector.comprehensive.min-vote-count=${COLLECTOR_COMPREHENSIVE_MIN_VOTE_COUNT:10}
collector.comprehensive.max-pages-per-strategy=${COLLECTOR_COMPREHENSIVE_MAX_PAGES:50}

# Scheduled model pass over new character credits: hourly tick, at most one batch a day of up to 20k credits
character-name-model.schedule.enabled=${CHARACTER_NAME_MODEL_SCHEDULE_ENABLED:true}
character-name-model.schedule.cron=${CHARACTER_NAME_MODEL_SCHEDULE_CRON:0 23 * * * *}
character-name-model.schedule.submit-every-hours=${CHARACTER_NAME_MODEL_SUBMIT_EVERY_HOURS:24}
character-name-model.schedule.max-items=${CHARACTER_NAME_MODEL_MAX_ITEMS:20000}

# Nightly rebuild of the given-name catalog and its research and compound links
given-names.refresh.enabled=${GIVEN_NAMES_REFRESH_ENABLED:true}
given-names.refresh.cron=${GIVEN_NAMES_REFRESH_CRON:0 41 4 * * *}

# Name market: nightly TMDB revenue refresh for recent films, then rebuild recent weeks of the name index
market.schedule.enabled=${MARKET_SCHEDULE_ENABLED:true}
market.schedule.cron=${MARKET_SCHEDULE_CRON:0 30 5 * * *}
